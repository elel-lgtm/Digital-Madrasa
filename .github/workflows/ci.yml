name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Runs before anything else: a leaked key is the one failure that cannot
      # be undone by reverting a commit.
      - name: Secret scan
        run: npm run secret-scan

      - name: Typecheck
        run: npm run typecheck
