# Supabase project configuration.
#
# Only the parts we actually use are declared. Local stack settings are
# deliberately omitted: this project deploys straight to the hosted project
# via `supabase functions deploy --use-api`, which needs no Docker.

project_id = "rblnistltccysizdcnvt"

[functions.create-student]
verify_jwt = true

[functions.issue-invoices]
verify_jwt = true

[functions.link-child]
verify_jwt = true

[functions.decide-link]
verify_jwt = true

[functions.attendance-qr]
verify_jwt = true

[functions.evaluate-recitation]
verify_jwt = true

[functions.ai-assistant]
verify_jwt = true

# Paystack calls this with no bearer token: the webhook is checked by its
# x-paystack-signature, and the browser return only triggers a server-side check.
[functions.card-callback]
verify_jwt = false

[functions.madrasa-lifecycle]
verify_jwt = true

[functions.health]
verify_jwt = false

[functions.payments]
verify_jwt = true

# Safaricom calls this with no bearer token; it checks MPESA_CALLBACK_SECRET instead.
[functions.payment-callback]
verify_jwt = false

# Called by pg_net / pg_cron with x-dispatch-key (DISPATCH_SECRET), not a JWT.
[functions.dispatch-notifications]
verify_jwt = false
